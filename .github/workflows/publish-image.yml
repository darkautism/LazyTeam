name: publish-image

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify validated commit is still main HEAD
        id: current
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$VALIDATED_SHA" = "$current_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale validated commit $VALIDATED_SHA; main is $current_sha"
          fi

      - name: Build server release-candidate image
        if: steps.current.outputs.publish == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: docker build --build-arg LAZYTEAM_GIT_SHA="$VALIDATED_SHA" -t lazyteam:release-candidate .

      - name: Verify automatic Docker UID/GID adaptation
        if: steps.current.outputs.publish == 'true'
        run: sh scripts/docker-permission-smoke.sh lazyteam:release-candidate

      - name: Build worker release-candidate image
        if: steps.current.outputs.publish == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: docker build -f Dockerfile.worker --build-arg LAZYTEAM_GIT_SHA="$VALIDATED_SHA" -t lazyteam-worker:release-candidate .

      - name: Set up QEMU
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push validated server image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/darkautism/lazyteam:latest
            ghcr.io/darkautism/lazyteam:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=lazyteam-server
          cache-to: type=gha,mode=max,scope=lazyteam-server
          provenance: mode=max
          sbom: true

      - name: Build and push validated worker image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: |
            ghcr.io/darkautism/lazyteam-worker:latest
            ghcr.io/darkautism/lazyteam-worker:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=lazyteam-worker
          cache-to: type=gha,mode=max,scope=lazyteam-worker
          provenance: mode=max
          sbom: true

      - name: Verify published multi-arch manifests
        if: steps.current.outputs.publish == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          for image in \
            "ghcr.io/darkautism/lazyteam:sha-$VALIDATED_SHA" \
            "ghcr.io/darkautism/lazyteam-worker:sha-$VALIDATED_SHA"
          do
            raw="$(docker buildx imagetools inspect --raw "$image")"
            printf '%s' "$raw" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $arches
              | ($arches | index("amd64")) != null
                and ($arches | index("arm64")) != null
            ' >/dev/null
            echo "verified amd64+arm64: $image"
          done

      - name: Verify worker container sandbox
        if: steps.current.outputs.publish == 'true'
        run: sh scripts/worker-container-smoke.sh lazyteam-worker:release-candidate
