name: publish-image

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify validated commit is still main HEAD
        id: current
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$VALIDATED_SHA" = "$current_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale validated commit $VALIDATED_SHA; main is $current_sha"
          fi

      - name: Build release-candidate image
        if: steps.current.outputs.publish == 'true'
        run: docker build -t lazyteam:release-candidate .

      - name: Verify automatic Docker UID/GID adaptation
        if: steps.current.outputs.publish == 'true'
        run: sh scripts/docker-permission-smoke.sh lazyteam:release-candidate

      - name: Set up Docker Buildx
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push validated image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/darkautism/lazyteam:latest
            ghcr.io/darkautism/lazyteam:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          provenance: mode=max
          sbom: true
