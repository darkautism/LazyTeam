name: Build and Push Docker Images

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Require successful CI
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        run: echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

  server-amd64:
    needs: prepare
    name: Server / amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ needs.prepare.outputs.sha }}
          tags: ghcr.io/darkautism/lazyteam:sha-${{ needs.prepare.outputs.sha }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=lazyteam-server-amd64
          cache-to: type=gha,mode=max,scope=lazyteam-server-amd64
          provenance: false
          sbom: false

  server-arm64:
    needs: prepare
    name: Server / arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ needs.prepare.outputs.sha }}
          tags: ghcr.io/darkautism/lazyteam:sha-${{ needs.prepare.outputs.sha }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          cache-from: type=gha,scope=lazyteam-server-arm64
          cache-to: type=gha,mode=max,scope=lazyteam-server-arm64
          provenance: false
          sbom: false

  worker-amd64:
    needs: prepare
    name: Worker / amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build locally, smoke, then push
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          image="ghcr.io/darkautism/lazyteam-worker:sha-$SHA-amd64"
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --file Dockerfile.worker \
            --build-arg "LAZYTEAM_GIT_SHA=$SHA" \
            --tag "$image" \
            .
          sh scripts/worker-container-smoke.sh "$image"
          docker push "$image"

  worker-arm64:
    needs: prepare
    name: Worker / arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build locally, smoke, then push
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          image="ghcr.io/darkautism/lazyteam-worker:sha-$SHA-arm64"
          docker buildx build \
            --load \
            --platform linux/arm64 \
            --file Dockerfile.worker \
            --build-arg "LAZYTEAM_GIT_SHA=$SHA" \
            --tag "$image" \
            .
          sh scripts/worker-container-smoke.sh "$image"
          docker push "$image"

  manifest:
    name: Publish multi-arch manifests
    needs: [prepare, server-amd64, server-arm64, worker-amd64, worker-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create manifests
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          for package in lazyteam lazyteam-worker
          do
            docker buildx imagetools create \
              -t "ghcr.io/darkautism/$package:latest" \
              -t "ghcr.io/darkautism/$package:sha-$SHA" \
              "ghcr.io/darkautism/$package:sha-$SHA-amd64" \
              "ghcr.io/darkautism/$package:sha-$SHA-arm64"
          done
      - name: Verify manifests
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -eu
          for image in \
            "ghcr.io/darkautism/lazyteam:sha-$SHA" \
            "ghcr.io/darkautism/lazyteam-worker:sha-$SHA"
          do
            raw="$(docker buildx imagetools inspect --raw "$image")"
            printf '%s' "$raw" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $arches
              | ($arches | index("amd64")) != null
                and ($arches | index("arm64")) != null
            ' >/dev/null
          done
