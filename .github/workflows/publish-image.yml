name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-amd64:
    name: Server / amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ github.sha }}
          tags: ghcr.io/darkautism/lazyteam:sha-${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lazyteam-server-amd64
          cache-to: type=gha,mode=max,scope=lazyteam-server-amd64
          provenance: false
          sbom: false

  server-arm64:
    name: Server / arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ github.sha }}
          tags: ghcr.io/darkautism/lazyteam:sha-${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lazyteam-server-arm64
          cache-to: type=gha,mode=max,scope=lazyteam-server-arm64
          provenance: false
          sbom: false

  worker-amd64:
    name: Worker / amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/amd64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ github.sha }}
          tags: ghcr.io/darkautism/lazyteam-worker:sha-${{ github.sha }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lazyteam-worker-amd64
          cache-to: type=gha,mode=max,scope=lazyteam-worker-amd64
          provenance: false
          sbom: false

  worker-arm64:
    name: Worker / arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          platforms: linux/arm64
          build-args: |
            LAZYTEAM_GIT_SHA=${{ github.sha }}
          tags: ghcr.io/darkautism/lazyteam-worker:sha-${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/darkautism/LazyTeam
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lazyteam-worker-arm64
          cache-to: type=gha,mode=max,scope=lazyteam-worker-arm64
          provenance: false
          sbom: false

  manifest:
    name: Publish multi-arch manifests
    needs: [server-amd64, server-arm64, worker-amd64, worker-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create manifests
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          for package in lazyteam lazyteam-worker
          do
            docker buildx imagetools create \
              -t "ghcr.io/darkautism/$package:latest" \
              -t "ghcr.io/darkautism/$package:sha-$SHA" \
              "ghcr.io/darkautism/$package:sha-$SHA-amd64" \
              "ghcr.io/darkautism/$package:sha-$SHA-arm64"
          done
      - name: Verify manifests
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          for image in \
            "ghcr.io/darkautism/lazyteam:sha-$SHA" \
            "ghcr.io/darkautism/lazyteam-worker:sha-$SHA"
          do
            raw="$(docker buildx imagetools inspect --raw "$image")"
            printf '%s' "$raw" | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] as $arches
              | ($arches | index("amd64")) != null
                and ($arches | index("arm64")) != null
            ' >/dev/null
          done

  worker-smoke-amd64:
    name: Worker smoke / amd64
    needs: manifest
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify sandbox
        env:
          SHA: ${{ github.sha }}
        run: sh scripts/worker-container-smoke.sh "ghcr.io/darkautism/lazyteam-worker:sha-$SHA-amd64"

  worker-smoke-arm64:
    name: Worker smoke / arm64
    needs: manifest
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify sandbox
        env:
          SHA: ${{ github.sha }}
        run: sh scripts/worker-container-smoke.sh "ghcr.io/darkautism/lazyteam-worker:sha-$SHA-arm64"
