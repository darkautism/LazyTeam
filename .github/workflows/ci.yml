name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test --workspace

      - name: Development OAuth and scheduler smoke tests
        env:
          LAZYTEAM_LISTEN: 127.0.0.1:8787
          LAZYTEAM_PUBLIC_URL: http://127.0.0.1:8787
          LAZYTEAM_DATABASE_URL: sqlite:///tmp/lazyteam-ci.db?mode=rwc
          LAZYTEAM_OAUTH_PASSWORD: smoke-secret
          LAZYTEAM_SMOKE_URL: http://127.0.0.1:8787
        run: |
          cargo build -p lazyteam-server
          ./target/debug/lazyteam-server >/tmp/lazyteam-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8787/health >/dev/null; then
            cat /tmp/lazyteam-server.log
            exit 1
          fi
          python3 scripts/oauth-smoke.py
          python3 scripts/control-plane-smoke.py

      - name: Production security smoke test
        env:
          LAZYTEAM_LISTEN: 127.0.0.1:8788
          LAZYTEAM_PUBLIC_URL: https://lazyteam.example.test
          LAZYTEAM_DATABASE_URL: sqlite:///tmp/lazyteam-security.db?mode=rwc
          LAZYTEAM_PRODUCTION: "true"
          LAZYTEAM_OAUTH_PASSWORD: smoke-security-password-1234
          LAZYTEAM_ADMIN_TOKEN: admin-security-smoke-token-0123456789abcdef
          LAZYTEAM_WORKER_TOKEN: worker-security-smoke-token-0123456789abcdef
          LAZYTEAM_ALLOWED_OAUTH_CLIENT_HOSTS: chatgpt.com,*.chatgpt.com
          LAZYTEAM_ALLOWED_REDIRECT_HOSTS: chatgpt.com,*.chatgpt.com
          LAZYTEAM_SECURITY_SMOKE_URL: http://127.0.0.1:8788
        run: |
          ./target/debug/lazyteam-server >/tmp/lazyteam-security.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8788/health >/dev/null; then
            cat /tmp/lazyteam-security.log
            exit 1
          fi
          python3 scripts/security-smoke.py

      - name: Production rejects insecure public URL
        run: |
          set +e
          timeout 3s env \
            LAZYTEAM_LISTEN=127.0.0.1:8790 \
            LAZYTEAM_DATABASE_URL=sqlite:///tmp/lazyteam-insecure.db?mode=rwc \
            LAZYTEAM_PRODUCTION=true \
            LAZYTEAM_PUBLIC_URL=http://lazyteam.example.test \
            LAZYTEAM_OAUTH_PASSWORD=smoke-security-password-1234 \
            LAZYTEAM_ADMIN_TOKEN=admin-security-smoke-token-0123456789abcdef \
            LAZYTEAM_WORKER_TOKEN=worker-security-smoke-token-0123456789abcdef \
            LAZYTEAM_ALLOWED_OAUTH_CLIENT_HOSTS=chatgpt.com \
            LAZYTEAM_ALLOWED_REDIRECT_HOSTS=chatgpt.com \
            ./target/debug/lazyteam-server >/tmp/lazyteam-insecure.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            cat /tmp/lazyteam-insecure.log
            echo "production server accepted an insecure public URL"
            exit 1
          fi

      - name: Docker production image and compose validation
        env:
          LAZYTEAM_PUBLIC_URL: https://lazyteam.example.test
          LAZYTEAM_DOMAIN: lazyteam.example.test
          LAZYTEAM_OAUTH_PASSWORD: smoke-security-password-1234
          LAZYTEAM_ADMIN_TOKEN: admin-security-smoke-token-0123456789abcdef
          LAZYTEAM_WORKER_TOKEN: worker-security-smoke-token-0123456789abcdef
        run: |
          docker build -t lazyteam:ci .
          docker compose -f docker-compose.yml config >/dev/null
          docker compose -f docker-compose.public.yml config >/dev/null
