services:
  lazyteam-worker:
    image: ghcr.io/darkautism/lazyteam-worker:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      LAZYTEAM_WORKER_JOIN_CODE: "${LAZYTEAM_WORKER_JOIN_CODE:-}"
      LAZYTEAM_WORKER_NAME: "${LAZYTEAM_WORKER_NAME:-worker-01}"
      LAZYTEAM_PUID: "${LAZYTEAM_PUID:-}"
      LAZYTEAM_PGID: "${LAZYTEAM_PGID:-}"
      RUST_LOG: "${RUST_LOG:-lazyteam_worker=info}"
      LAZYTEAM_PI_AUTO_UPDATE: "${LAZYTEAM_PI_AUTO_UPDATE:-1}"
      LAZYTEAM_PI_UPDATE_INTERVAL_SECS: "${LAZYTEAM_PI_UPDATE_INTERVAL_SECS:-86400}"
    command: ["lazyteam-worker", "--project", "*", "--slots", "${LAZYTEAM_WORKER_SLOTS:-1}"]
    volumes:
      - lazyteam-worker-state:/app/state
      - lazyteam-worker-workspaces:/app/workspaces
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FSETID
      - SYS_ADMIN
      - SYS_CHROOT
      - SETGID
      - SETUID
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

volumes:
  lazyteam-worker-state:
  lazyteam-worker-workspaces:
