services:
  lazyteam:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      LAZYTEAM_LISTEN: "0.0.0.0:8787"
      LAZYTEAM_DATABASE_URL: "sqlite:///app/data/lazyteam.db?mode=rwc"
      LAZYTEAM_PRODUCTION: "true"
      LAZYTEAM_PUBLIC_URL: "${LAZYTEAM_PUBLIC_URL:?set LAZYTEAM_PUBLIC_URL to your public https URL}"
      LAZYTEAM_OAUTH_PASSWORD: "${LAZYTEAM_OAUTH_PASSWORD:?set LAZYTEAM_OAUTH_PASSWORD}"
      LAZYTEAM_ADMIN_TOKEN: "${LAZYTEAM_ADMIN_TOKEN:?set LAZYTEAM_ADMIN_TOKEN}"
      LAZYTEAM_WORKER_TOKEN: "${LAZYTEAM_WORKER_TOKEN:?set LAZYTEAM_WORKER_TOKEN}"
      LAZYTEAM_ALLOWED_OAUTH_CLIENT_HOSTS: "${LAZYTEAM_ALLOWED_OAUTH_CLIENT_HOSTS:-chatgpt.com,*.chatgpt.com}"
      LAZYTEAM_ALLOWED_REDIRECT_HOSTS: "${LAZYTEAM_ALLOWED_REDIRECT_HOSTS:-chatgpt.com,*.chatgpt.com}"
      LAZYTEAM_INTERACTIVE_SANDBOX_CAPS: "1"
      RUST_LOG: "${RUST_LOG:-lazyteam_server=info,tower_http=info}"
    volumes:
      - lazyteam-data:/app/data
      - lazyteam-workspaces:/app/workspaces
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - apparmor=unconfined
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lazyteam-data:
  lazyteam-workspaces:
